<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="projName">开发仪表盘</h1>
      <span class="by">（由 control-your-development 生成）</span>
    </div>
    <div class="topacts">
      <button id="setBtn" class="iconbtn" title="设置" style="display:none">⚙</button>
      <button id="verBtn" class="iconbtn" title="版本快照" style="display:none">🕓</button>
      <button id="themeBtn" class="iconbtn" title="切换主题">🌓</button>
    </div>
  </header>
  <div class="strip" id="strip"></div>
  <div class="runbar" id="runbar" hidden></div>
  <div class="receipt" id="receipt" hidden></div>
  <nav class="tabs">
    <button data-tab="project" class="on">🏠 项目</button>
    <button data-tab="features">🗺 功能地图</button>
    <button data-tab="now">⚡ 现在</button>
    <button data-tab="decisions">⚖ 决策与待办</button>
    <button data-tab="glossary">📖 术语表</button>
  </nav>

  <div class="workspace">
    <main class="mainarea">
      <section id="project" class="on"></section>
      <section id="features"></section>
      <section id="now"></section>
      <section id="decisions"></section>
      <section id="glossary"></section>
    </main>
    <aside class="inspector" id="inspector" hidden aria-live="polite">
      <div class="inshead">
        <div class="institle" id="insTitle"></div>
        <button class="iconbtn" id="insClose" title="关闭检查器（Esc）">✕</button>
      </div>
      <div class="insbody" id="insBody"></div>
    </aside>
  </div>

  <div class="drawer" id="drawer">
    <button class="drawerhead" id="drawerBtn" aria-expanded="false">
      <span class="dwtitle">进展与决策</span>
      <span class="dwsum" id="drawerSum"></span>
      <span class="dwcaret" aria-hidden="true">▾</span>
    </button>
    <div class="drawerbody" id="drawerBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>
