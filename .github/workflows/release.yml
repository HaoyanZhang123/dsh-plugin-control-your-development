name: release

# 打 tag（v*）即自动：装依赖 → 构建并校验产物可复现 → 单测/类型 → 包形态与打包卫生 → 发布 npm（若该版本尚未发布）→ 建 GitHub Release
#
# 发布身份（1.0.0 起）：
#   - 产物是 `lib/index.js`（host ESM）+ `lib/client.js`（客户端 bundle），由 `tools/build.mjs`(dev 树) 产出后同步到本仓；
#   - 本仓不再有 skill/ 与 build_panel.py（0.7.x 的旧渲染链已在 1.0.0 整体移除）；
#   - 预发布版本（版本号带 `-`，如 1.0.0-alpha.1）发布到 npm 的 `alpha` dist-tag，**不动 latest**。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 创建 GitHub Release
  id-token: write   # npm Trusted Publishing（OIDC）；未配置时用 NPM_TOKEN 亦可

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # pnpm 不在 runner 默认镜像里：必须显式装（本轮实测漏了这步 → `pnpm: command not found`，exit 127）
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 装开发依赖（构建/测试用；不进包）
        run: pnpm install

      - name: 版本一致性（tag = package.json）
        run: |
          node -e "const v=require('./package.json').version; const t=(process.env.GITHUB_REF_NAME||'').replace(/^v/,''); if(t && t!==v){throw new Error('tag '+t+' != package.json '+v)} console.log('version ok', v)"

      - name: 构建可复现（重建后必须无 diff）
        run: |
          pnpm run build
          git diff --exit-code -- lib

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元与集成测试
        run: pnpm run test

      - name: 包形态与打包卫生
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle||!p.dsh.bundle.patch){throw new Error('missing dsh.bundle')} if((p.files||[]).length<6){throw new Error('files whitelist looks empty')} if((p.dependencies&&Object.keys(p.dependencies).length)){throw new Error('runtime dependencies are not allowed')} console.log('package ok', p.name, p.version)"
          node -e "const {execSync}=require('child_process'); const out=execSync('npm pack --dry-run --json',{encoding:'utf8'}); const files=JSON.parse(out)[0].files.map(f=>f.path); const junk=files.filter(f=>f.includes('__pycache__')||f.endsWith('.pyc')||f.endsWith('.tgz')||f.endsWith('.log')||f.startsWith('src/')||f.startsWith('tests/')); if(junk.length){throw new Error('打包内容混入不该有的项: '+junk.join(', '))} console.log('pack clean:', files.length, 'files')"

      - name: 发布到 npm（dist-tag 由 publishConfig.tag 决定；同版本已存在则跳过）
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # dist-tag 的**唯一事实源**是 package.json 的 publishConfig.tag（npm 官方机制）。
          # 历史回退规则保留：预发布版本（版本号带 `-`）→ alpha，其余 → latest。
          # 为什么需要这个字段：1.5.4 是「未完成版」，必须显式发到 unfinished，
          # 绝不能因为版本号里没有 `-` 就默认顶掉 latest（那会让所有人默认装到未完成版）。
          DIST_TAG=$(node -p "(require('./package.json').publishConfig||{}).tag || ''")
          if [ -z "$DIST_TAG" ]; then
            if echo "$VERSION" | grep -q -- '-'; then DIST_TAG=alpha; else DIST_TAG=latest; fi
          fi
          echo "publishing $NAME@$VERSION with dist-tag: $DIST_TAG"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "版本 $NAME@$VERSION 已存在，跳过发布（避免重复发布失败）"
          else
            npm publish --access public --tag "$DIST_TAG"
          fi

      - name: 建 GitHub Release（优先用 docs/releases/<tag>.md）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            TITLE="$(head -n 1 "$NOTES" | sed 's/^#\{1,\} *//')"
            echo "用 $NOTES 作为 Release 说明，标题：$TITLE"
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file "$NOTES"
          else
            echo "没有 $NOTES，退回自动生成的说明"
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
